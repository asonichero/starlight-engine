<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starlight — Sandbox</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #16161b; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; color: #e8e6e3; }
  #view { position: fixed; top: 0; left: 0; right: 300px; bottom: 0; }
  #panel { position: fixed; top: 0; right: 0; width: 300px; height: 100%; box-sizing: border-box; background: rgba(20,20,26,0.96);
    border-left: 1px solid #2c2c36; padding: 14px 16px; overflow-y: auto; font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: #8a8a96; font-size: 11px; line-height: 1.5; margin-bottom: 8px; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #9aa0ac; margin: 14px 0 6px; border-bottom: 1px solid #2c2c36; padding-bottom: 4px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  button { background: #2e2e3a; color: #e8e6e3; border: 1px solid #454555; border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: #3a3a48; }
  button:disabled { opacity: 0.35; cursor: default; }
  button.on { background: #6b5a2a; border-color: #c9a84c; color: #fff; }
  button.go { background: #2a5a3a; border-color: #4ca86a; width: 100%; padding: 9px; font-size: 13px; margin-top: 4px; }
  button.go.running { background: #6b2a2a; border-color: #c94c4c; }
  .row { margin: 6px 0; display: flex; gap: 6px; }
  .row button { flex: 1; }
  .row2 { margin: 6px 0; }
  .row2 label { display: flex; justify-content: space-between; color: #c9c9d1; font-size: 12px; margin-bottom: 1px; }
  .row2 label span:last-child { color: #c9a84c; font-variant-numeric: tabular-nums; }
  .row2 input[type=range] { width: 100%; }
  #meter { height: 10px; background: #26262f; border-radius: 5px; overflow: hidden; margin-top: 4px; }
  #meter > div { height: 100%; width: 0; background: #6b9e5a; transition: width 0.15s, background 0.3s; }
  #band { font-size: 12px; color: #c9c9d1; margin-top: 3px; }
  #status { color: #8a8a96; font-size: 11px; margin-top: 8px; min-height: 2.6em; }
  #loading { position: fixed; inset: 0 300px 0 0; display: flex; align-items: center; justify-content: center; background: #16161b; color: #8a8a96; font-size: 14px; z-index: 5; }
  #loading.hide { display: none; }
</style>
</head>
<body>
<div id="view"></div>
<div id="loading">Loading the models…</div>
<div id="panel">
  <h1>Discipline sandbox</h1>
  <div class="sub">Pick a pair, a position, an implement and a severity, then press Start. Drag to orbit, scroll to zoom.</div>

  <h3>Disciplinarian</h3><div class="tabs" id="p-giver"></div>
  <h3>Subject</h3><div class="tabs" id="p-subject"></div>
  <h3>Position</h3><div class="tabs" id="p-position"></div>
  <h3>Implement</h3><div class="tabs" id="p-implement"></div>
  <h3>Severity</h3><div class="tabs" id="p-severity"></div>
  <div class="row2"><label><span>Strike speed</span><span id="v-speed"></span></label><input type="range" id="s-speed" min="0.5" max="2" step="0.05"></div>
  <div class="row2"><label><span>Hold before the swing</span><span id="v-hold"></span></label><input type="range" id="s-hold" min="0" max="3" step="0.05"></div>
  <div class="row2"><label><span>Hold after contact</span><span id="v-dwell"></span></label><input type="range" id="s-dwell" min="0" max="3" step="0.05"></div>
  <div class="row2"><label><span>Smacks</span><span id="v-count"></span></label><input type="range" id="s-count" min="1" max="400" step="1"></div>
  <h3>Subject's limits</h3>
  <div class="row2"><label><span>Tolerance</span><span id="v-tol"></span></label><input type="range" id="s-tol" min="0.05" max="1" step="0.01"></div>
  <div class="row2"><label><span>Resilience</span><span id="v-res"></span></label><input type="range" id="s-res" min="0.05" max="1" step="0.01"></div>
  <div id="meter"><div></div></div><div id="band"></div>
  <div class="tabs" style="margin-top:6px"><button id="stoplimit" class="on">Stop at their limit</button><button id="resetpain">Rest</button></div>
  <h3>Clothing</h3>
  <div class="tabs"><button id="c-bottoms">Bottoms down</button><button id="c-briefs">Briefs down</button></div>
  <h3>Session</h3>
  <button class="go" id="go">Start</button>
  <div class="row"><button id="clear">Clear marks</button><button id="sound" class="on">Sound</button></div>
  <div id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>document.write('<script src="starlight-engine.js?v=' + Date.now() + '"><\/script>');</script>
<script>
(function () {
'use strict';
const S = window.Starlight;
const { PRESETS, ORDER, clone } = S;

// ── Choices ──────────────────────────────────────────────
const POSITIONS = [['lap', 'Across the lap'], ['case', 'Over the case'], ['head', 'Hands on head'], ['knees', 'Hands on knees'], ['spread', 'Bent over, feet spread']];
const IMPLEMENTS = [['hand', 'Hand'], ['hairbrush', 'Hair brush'], ['rod', 'Rod'], ['paddle', 'Paddle']];
// Severity: how hard each smack lands, how fast the arm moves, how many smacks, the hold before the swing and the hold after contact
// (the last three can then be changed by hand). What each does to the subject is the pain model's (PAIN in the engine).
const SEVERITY = [
  { name: 'Light',  strength: 0.35, speed: 0.8,  count: 8,  hold: 0.15, dwell: 1.0 },
  { name: 'Medium', strength: 0.6,  speed: 1.0,  count: 12, hold: 0.3,  dwell: 0.6 },
  { name: 'Firm',   strength: 0.85, speed: 1.2,  count: 16, hold: 0.2,  dwell: 0.45 },
  { name: 'Severe', strength: 1.0,  speed: 1.45, count: 22, hold: 0.1,  dwell: 0.3 },
];
// Camera for each position (from the disciplinarian's side).
const CAMERA = {
  lap:    { pos: [2.5, 1.5, 3.2], target: [0, 0.6, 0.2] },
  case:   { pos: [-2.7, 1.45, -2.9], target: [-0.05, 0.85, -0.15] },
  head:   { pos: [-3.2, 1.45, -2.9], target: [-0.1, 0.9, -0.3] },
  knees:  { pos: [-2.8, 1.4, -3.0], target: [-0.05, 0.8, -0.2] },
  spread: { pos: [-3.0, 1.45, -3.4], target: [-0.1, 0.85, -0.45] },
};
const sel = { giver: 'aya', subject: 'kiko', position: 'case', implement: 'hand', severity: 1, bottoms: true, briefs: false, sound: true, stopAtLimit: true };
// The strike settings (start from the severity, then follow the sliders) and each character's own limits (start from their preset).
const strike = { speed: 1, hold: 0.3, dwell: 0.6, count: 12 };
const stats = {}; ORDER.forEach(k => stats[k] = { tolerance: PRESETS[k].tolerance, resilience: PRESETS[k].resilience });
let scn = null, running = false, done = 0, since = 0, total = 0;
const SEV_FACE = [0.15, 0.45, 0.75, 1];   // how stern the disciplinarian's face is, by severity
function fromSeverity() { if (scn) scn.severity = SEV_FACE[sel.severity]; const v = SEVERITY[sel.severity]; strike.speed = v.speed; strike.hold = v.hold; strike.dwell = v.dwell; strike.count = v.count; }
fromSeverity();

// ── Three.js scene ───────────────────────────────────────
const lin = S.lin;
const viewEl = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
// A phone's GPU can refuse a shader and the skin just doesn't draw: say why on screen (also shown with ?gl in the address).
(() => { const b = document.createElement('div'); b.id = 'glbanner'; b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:50;background:#5a1f1f;color:#ffd9d9;font:12px/1.4 monospace;padding:8px 10px;border-radius:6px;white-space:pre-wrap;display:none;max-height:40vh;overflow:auto'; b.onclick = () => b.style.display = 'none'; document.body.appendChild(b);
  S.watchGL(renderer, msg => { b.textContent = msg; b.style.display = 'block'; }); })();
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(viewEl.clientWidth, viewEl.clientHeight);
renderer.shadowMap.enabled = true; renderer.localClippingEnabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
viewEl.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x16161b);
const camera = new THREE.PerspectiveCamera(35, viewEl.clientWidth / viewEl.clientHeight, 0.05, 50);
const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xf4efe8, 0x2a2622, 0.55));
const key = new THREE.DirectionalLight(0xfff1e0, 1.25); key.position.set(2, 4, 3); key.castShadow = true;
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.012; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -0.5, near: 0.5, far: 12 });
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fb8ff, 0.55); rim.position.set(-2.5, 2.5, -3); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 64), new THREE.MeshStandardMaterial({ color: lin(0x1c1c22), roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
window.addEventListener('resize', () => {
  camera.aspect = viewEl.clientWidth / viewEl.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(viewEl.clientWidth, viewEl.clientHeight);
});

// ── Sound: a clap per smack (as the viewer's) ────────────
const Sound = (() => {
  let ctx = null, buf = null;
  const init = () => {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      buf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
  };
  const burst = (t, dur, freq, peak) => {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.002 + dur);
    s.connect(f); f.connect(g); g.connect(ctx.destination); s.start(t); s.stop(t + dur + 0.05);
  };
  const clap = (strength = 1) => {
    if (!ctx || !sel.sound) return;
    const t = ctx.currentTime, k = 0.25 + 0.2 * strength;
    if (sel.implement === 'hairbrush') { burst(t, 0.04, 3600, k); burst(t + 0.004, 0.06, 700, 0.55 * k); }
    else if (sel.implement === 'rod') { burst(t, 0.03, 4800, k); burst(t + 0.002, 0.05, 1500, 0.4 * k); }
    else if (sel.implement === 'paddle') { burst(t, 0.07, 2000, 1.1 * k); burst(t + 0.003, 0.11, 420, 0.8 * k); burst(t + 0.006, 0.05, 4200, 0.35 * k); }
    else { burst(t, 0.09, 2500, 0.9 * k); burst(t + 0.008, 0.05, 1100, 0.5 * k); }
  };
  return { init, clap };
})();

// ── The scene ────────────────────────────────────────────
let pair = null;   // { g, s }
function disposePair() {
  if (!pair) return;
  if (scn) {
    // Marks stay with the person across rebuilds of the same pairing.
    scn.dispose(); scn = null;
  }
  for (const c of [pair.g, pair.s]) S.disposeCharacter(c);
  pair = null;
}
const savedMarks = {};   // key → { marks, stripes } kept while the same person is subject
function build() {
  if (pair) {
    if (pair.s) savedMarks[pair.s.key] = { marks: pair.s.marks, stripes: pair.s.stripes };
    disposePair();
  }
  const mk = k => S.buildCharacter(clone(PRESETS[k]), { voxel: 0.011, key: k });
  const g = mk(sel.giver), s = mk(sel.subject);
  for (const c of [g, s]) { scene.add(c.group); scene.add(c.helper); c.helper.visible = false; }
  const sv = savedMarks[sel.subject];
  if (sv) { s.marks = sv.marks; s.stripes = sv.stripes; S.copyMarks(s, s); }
  scn = S.createDisciplineScene(scene, g, s, { lower: sel.bottoms, position: sel.position, pain: stats[sel.subject], faces: true, severity: SEV_FACE[sel.severity] });   // (the same object: the sliders change the limits live)
  if (sel.briefs) S.setLowered(s, 'briefs', true);
  scn.onImpact = (side, strength) => { Sound.clap(strength); done++; since = 0; updateStatus(); };
  scn.setImplement(sel.implement);
  pair = { g, s };
  scn.setBeat('relaxed');
  const C = CAMERA[sel.position]; camera.position.set(...C.pos); controls.target.set(...C.target);
  stopRun(); updateStatus();
}

// ── Running ──────────────────────────────────────────────
function startRun() {
  if (!scn) return;
  const v = SEVERITY[sel.severity];
  scn.timing = { ...scn.timing, speed: strike.speed };
  running = true; done = 0; since = 0; total = strike.count; Sound.init();
  document.getElementById('go').textContent = 'Stop'; document.getElementById('go').classList.add('running');
  updateStatus();
}
function stopRun() {
  running = false;
  if (scn) scn.lower(0.5);
  const b = document.getElementById('go'); b.textContent = 'Start'; b.classList.remove('running');
  updateStatus();
}
function updateStatus() {
  const v = SEVERITY[sel.severity];
  document.getElementById('status').textContent = running
    ? `${done} of ${total} smacks — ${v.name.toLowerCase()}.`
    : done ? (scn && scn.pain && scn.pain.atLimit && sel.stopAtLimit ? `Stopped after ${done}: they reached their limit.` : `Finished: ${done} smacks.`) : 'Ready.';
}

// ── Choosers ─────────────────────────────────────────────
function chooser(id, items, key, onPick) {
  const el = document.getElementById(id); el.innerHTML = '';
  items.forEach(([val, label]) => {
    const b = document.createElement('button'); b.textContent = label; b.dataset.v = val;
    b.onclick = () => { if (b.disabled) return; onPick(val); };
    el.appendChild(b);
  });
}
function refresh() {
  const on = (id, v) => document.querySelectorAll('#' + id + ' button').forEach(b => b.classList.toggle('on', b.dataset.v === String(v)));
  on('p-giver', sel.giver); on('p-subject', sel.subject); on('p-position', sel.position); on('p-implement', sel.implement); on('p-severity', sel.severity);
  // Dual-strike positions only offer dual-strike implements.
  document.querySelectorAll('#p-implement button').forEach(b => { b.disabled = sel.position === 'spread' && !S.IMPLEMENTS[b.dataset.v].dual; });
  document.getElementById('c-bottoms').classList.toggle('on', sel.bottoms);
  document.getElementById('c-briefs').classList.toggle('on', sel.briefs);
  document.getElementById('sound').classList.toggle('on', sel.sound);
  document.getElementById('stoplimit').classList.toggle('on', sel.stopAtLimit);
  const set = (id, v, f) => { document.getElementById('s-' + id).value = v; document.getElementById('v-' + id).textContent = f(v); };
  set('count', strike.count, v => v + ''); set('speed', strike.speed, v => v.toFixed(2) + '×'); set('hold', strike.hold, v => v.toFixed(2) + ' s'); set('dwell', strike.dwell, v => v.toFixed(2) + ' s');
  const st = stats[sel.subject]; set('tol', st.tolerance, v => v.toFixed(2)); set('res', st.resilience, v => v.toFixed(2));
}
for (const [id, key] of [['count', 'count'], ['speed', 'speed'], ['hold', 'hold'], ['dwell', 'dwell']]) document.getElementById('s-' + id).oninput = e => {
  strike[key] = +e.target.value; if (key === 'count') total = strike.count; if (key === 'speed' && scn) scn.timing = { ...scn.timing, speed: strike.speed }; refresh();
};
for (const [id, key] of [['tol', 'tolerance'], ['res', 'resilience']]) document.getElementById('s-' + id).oninput = e => { stats[sel.subject][key] = +e.target.value; refresh(); };
document.getElementById('stoplimit').onclick = () => { sel.stopAtLimit = !sel.stopAtLimit; refresh(); };
document.getElementById('resetpain').onclick = () => { if (scn && scn.pain) scn.pain.reset(); };
chooser('p-giver', ORDER.map(k => [k, PRESETS[k].name]), 'giver', k => { if (sel.subject === k) sel.subject = sel.giver; sel.giver = k; refresh(); build(); });
chooser('p-subject', ORDER.map(k => [k, PRESETS[k].name]), 'subject', k => { if (sel.giver === k) sel.giver = sel.subject; sel.subject = k; refresh(); build(); });
chooser('p-position', POSITIONS, 'position', p => {
  sel.position = p;
  if (p === 'spread' && !S.IMPLEMENTS[sel.implement].dual) sel.implement = Object.keys(S.IMPLEMENTS).find(n => S.IMPLEMENTS[n].dual) || 'hand';
  refresh(); build();
});
chooser('p-implement', IMPLEMENTS, 'implement', n => { sel.implement = n; refresh(); if (scn) { scn.setImplement(n); scn.setBeat('relaxed'); } });
chooser('p-severity', SEVERITY.map((v, i) => [i, v.name]), 'severity', i => { sel.severity = i; fromSeverity(); refresh(); if (running) { scn.timing = { ...scn.timing, speed: strike.speed }; total = strike.count; updateStatus(); } });
document.getElementById('c-bottoms').onclick = () => { sel.bottoms = !sel.bottoms; refresh(); build(); };
document.getElementById('c-briefs').onclick = () => { sel.briefs = !sel.briefs; refresh(); build(); };
document.getElementById('sound').onclick = () => { sel.sound = !sel.sound; refresh(); };
document.getElementById('clear').onclick = () => { if (pair) { S.clearMarks(pair.s); delete savedMarks[pair.s.key]; } };
document.getElementById('go').onclick = () => { if (running) stopRun(); else startRun(); };

// ── Frame loop ───────────────────────────────────────────
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (pair && scn) {
    if (running) {
      since += dt;
      const v = SEVERITY[sel.severity];
      if (!scn.busy() && since > strike.dwell) {
        if (done >= total || (sel.stopAtLimit && scn.pain && scn.pain.atLimit)) stopRun();
        else { scn.cycle(v.strength, undefined, undefined, strike.hold); since = 0; }
      }
    }
    const on = [pair.g, pair.s];
    for (const ch of on) S.animateCharacter(ch, dt, t);
    scn.update(dt);
    for (const ch of on) S.fadeMarks(ch, dt);
    for (const ch of on) { ch.group.updateMatrixWorld(true); S.bustSpring(ch, dt); }
    for (const ch of on) S.bustContact(ch, on);
    S.updateContacts(on);
    const colliders = on.flatMap(S.bodyColliders);
    for (const ch of on) S.hairStep(ch, dt, colliders);
    for (const ch of on) S.faceStep(ch, dt);
    for (const ch of on) S.skirtStep(ch, dt, on, [scn && scn.bench]);
    for (const ch of on) S.bunchStep(ch);
    if (scn.pain) {
      const d = scn.pain.distress(), m = document.querySelector('#meter > div');
      m.style.width = Math.min(100, d * 100) + '%';
      m.style.background = d < 0.3 ? '#6b9e5a' : d < 0.6 ? '#b4a24a' : d < 0.9 ? '#c8803c' : '#c24a3a';
      document.getElementById('band').textContent = `${pair.s.spec.m.name}: ${scn.pain.band()}`;
    }
  }
  controls.update();
  renderer.render(scene, camera);
}

// Build once the first frame is possible (the models take a moment).
setTimeout(() => {
  refresh(); build();
  document.getElementById('loading').classList.add('hide');
  frame();
}, 50);
// Test hook
window.__sandbox = { renderer, camera, controls, sel, get scn() { return scn; }, get pair() { return pair; }, build, startRun, stopRun, refresh, SEVERITY };
})();
</script>
</body>
</html>
